name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: Full test suite (fixtures + real CLI) and demo
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::withr, any::readxl

      - name: Run every test (fails on any failure, error or skip)
        env:
          DEFX_REQUIRE_FIXTURES: "true"
        run: |
          Rscript -e '
            r <- as.data.frame(testthat::test_local(".",
                   reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                   stop_on_failure = FALSE))
            line <- sprintf("tests %d | expectations %d | failed %d | errors %d | skipped %d | warnings %d",
                            nrow(r), sum(r$nb), sum(r$failed), sum(r$error), sum(r$skipped), sum(r$warning))
            cat("\n", line, "\n")
            s <- Sys.getenv("GITHUB_STEP_SUMMARY")
            if (nzchar(s)) cat("### Full test suite\n\n`", line, "`\n", file = s, append = TRUE, sep = "")
            if (sum(r$failed) + sum(r$error) > 0) quit(status = 1)
            if (sum(r$skipped) > 0) { message("skipped tests are not allowed in the full suite"); quit(status = 1) }'

      - name: Run the demo script end to end
        run: DEMO_NO_PAUSE=1 ./scripts/demo.sh

  package-check:
    name: R CMD check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # examples/ and bin/ are excluded from the built package (.Rbuildignore), so the
      # fixture-dependent and CLI tests skip here by design; the full-suite job runs them.
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
